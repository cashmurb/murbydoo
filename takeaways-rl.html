<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="BrainTopic" title="Reinforcement Learning" sections="{{ sections }}" link-text="{{ linkText }}" link-url="{{ linkUrl }}" hint-size="1440px,1024px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    import('./content/topics/rl.js').then((m) => { this.sections = m.sections; this.linkText = m.linkText; this.linkUrl = m.linkUrl; this.forceUpdate(); }).catch(() => {});
  }
  sections = [
      { heading: "What?", body: 'Coming soon.' },
      { heading: "Markov Decision Process", body: 'Coming soon.' },
      { heading: "Bellman Equations", body: 'Coming soon.' },
      { heading: "Policy vs Value", body: 'Coming soon.' },
      { heading: "Exploration vs. Exploitation", body: 'Coming soon.' }
  ];
  get linkText() { return "link to MsPacman project"; }
  get linkUrl() { return "#"; }
  renderVals() {
    return { sections: this.sections, linkText: this.linkText, linkUrl: this.linkUrl };
  }
}
</script>
</body>
</html>
