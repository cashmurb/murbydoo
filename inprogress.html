<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

  a { color: #D96614; }
  a:hover { color: #D96614; opacity: 0.8; }
</style>
<script>
function __scaleFit(){var s=Math.min(window.innerWidth/1440,window.innerHeight/1024);document.documentElement.style.setProperty('--s',s);}
window.addEventListener('resize',__scaleFit);window.addEventListener('DOMContentLoaded',__scaleFit);__scaleFit();
</script>
</helmet>
<div style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FFFFFF;">
<div style="width:1440px;height:1024px;background:#FFFFFF;position:relative;overflow:hidden;font-family:'Kode Mono',monospace;color:#000000;flex-shrink:0;transform:scale(var(--s,1));animation:fadeInPage .5s ease both;">

  <a href="index.html" style="position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:15px;color:#000000;text-decoration:none;z-index:10;">Cashmere Blanche Alin</a>

  <div style="position:absolute;left:1085px;top:43px;width:267px;height:64px;z-index:10;">
    <svg width="267" height="64" viewBox="0 0 267 64" style="position:absolute;top:0;left:0;">
      <line x1="45" y1="45.56" x2="98" y2="20" stroke="{{ edgeColor.brainWips }}" stroke-width="{{ edgeWidth.brainWips }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainWips }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="118" y1="20" x2="181" y2="46" stroke="{{ edgeColor.brainWorld }}" stroke-width="{{ edgeWidth.brainWorld }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainWorld }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="142" y1="12" x2="227" y2="12" stroke="{{ edgeColor.brainDump }}" stroke-width="{{ edgeWidth.brainDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="45" y1="59" x2="142" y2="59" stroke="{{ edgeColor.wipsWorld }}" stroke-width="{{ edgeWidth.wipsWorld }}" stroke-linecap="round" onmouseenter="{{ edgeHover.wipsWorld }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="216" y1="54" x2="252" y2="20" stroke="{{ edgeColor.worldDump }}" stroke-width="{{ edgeWidth.worldDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.worldDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="58" y1="49" x2="234" y2="20" stroke="{{ edgeColor.wipsDump }}" stroke-width="{{ edgeWidth.wipsDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.wipsDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
    </svg>
    <a href="takeaways.html" onmouseenter="{{ navHover.brain }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:88px;top:1px;font-size:15px;text-decoration:none;color:{{ navColor.brain }};transition:color .2s;">Brain</a>
    <a href="writing.html" onmouseenter="{{ navHover.dump }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:235px;top:1px;font-size:15px;text-decoration:none;color:{{ navColor.dump }};transition:color .2s;">Dump</a>
    <a href="inprogress.html" onmouseenter="{{ navHover.wips }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:0px;top:53px;font-size:15px;text-decoration:none;color:{{ navColor.wips }};transition:color .2s;">WIPs</a>
    <a href="projects.html" onmouseenter="{{ navHover.world }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:158px;top:52px;font-size:15px;text-decoration:none;color:{{ navColor.world }};transition:color .2s;">World</a>
  </div>

  <svg width="1440" height="1024" viewBox="0 0 1440 1024" style="position:absolute;top:0;left:0;pointer-events:none;">
    <path d="M83.7152 102H100.635V201L106.755 210.9H110.175L119.895 200.64V152.76H136.995V195.42L147.255 210.9H150.315L156.075 204.6V102H173.175V210L155.535 228H139.155L129.795 213.6L116.115 228H100.635L83.7152 202.98V102Z" fill="black" fill-opacity="0.17" style="pointer-events:auto;cursor:default;transition:fill .2s,fill-opacity .2s;" style-hover="fill:#D96614;fill-opacity:0.55;"></path>
    <path d="M87.4952 332H169.575V347.48H136.995V442.52H169.575V458H87.4952V442.52H120.075V347.48H87.4952V332Z" fill="black" fill-opacity="0.17" style="pointer-events:auto;cursor:default;transition:fill .2s,fill-opacity .2s;" style-hover="fill:#D96614;fill-opacity:0.55;"></path>
    <path d="M87.4952 562H154.635L169.575 584.5V614.56L154.455 629.86H104.415V688H87.4952V562Z M104.415 577.48V622.3L117.555 614.56H147.795L152.655 609.7V587.2L146.355 577.48H104.415Z" fill="black" fill-opacity="0.17" style="pointer-events:auto;cursor:default;transition:fill .2s,fill-opacity .2s;" style-hover="fill:#D96614;fill-opacity:0.55;"></path>
    <path d="M104.055 820.8H154.635L164.895 835.92L154.455 847.08L146.715 835.74H111.255L106.395 840.06V851.94L112.695 860.76H154.995L167.775 880.02V903.78L154.995 918H97.2152L89.2952 905.58L99.7352 894.6L105.135 902.52H147.795L151.035 899.1V882.9L146.355 876.24H103.875L89.6552 854.82V834.84L104.055 820.8Z" fill="black" fill-opacity="0.17" style="pointer-events:auto;cursor:default;transition:fill .2s,fill-opacity .2s;" style-hover="fill:#D96614;fill-opacity:0.55;"></path>
  </svg>

  <div style="position:absolute;left:272px;top:247px;font-size:15px;color:{{ mutedTextColor }};max-width:700px;">Works that I have yet to finish and ideas that have no come to life yet.</div>

  <div style="position:absolute;left:270px;top:283px;width:899px;height:459px;border:1px solid #000000;border-radius:15px;">

    <div onclick="{{ prevItem }}" style="position:absolute;left:56px;top:222px;cursor:pointer;font-size:24px;color:#000000;user-select:none;">&#10094;</div>
    <div onclick="{{ nextItem }}" style="position:absolute;right:64px;top:222px;cursor:pointer;font-size:24px;color:#000000;user-select:none;">&#10095;</div>

    <div style="position:absolute;inset:0;left:120px;right:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;">
      <div style="font-size:32px;font-weight:600;">{{ currentItem.title }}</div>
      <sc-if value="{{ currentItem.subtitle }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:12px;color:{{ mutedTextColor }};max-width:640px;">{{ currentItem.subtitle }}</div>
      </sc-if>
    </div>
  </div>

  <div style="position:absolute;top:770px;left:0;width:100%;display:flex;justify-content:center;gap:29px;">
    <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="3">
      <div onclick="{{ goToIndex($index) }}" style="width:72px;height:4px;background:{{ dot.color }};cursor:pointer;"></div>
    </sc-for>
  </div>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#D96614&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#D96614&quot;, &quot;#000000&quot;, &quot;#B4B4B4&quot;], &quot;section&quot;: &quot;Style&quot;},
  &quot;mutedTextColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#B4B4B4&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#B4B4B4&quot;, &quot;#000000&quot;, &quot;#D96614&quot;], &quot;section&quot;: &quot;Style&quot;}
}">
class Component extends DCLogic {
  state = { hoveredNode: null, index: 0 , hoveredEdge: null };

  hoverNode = (name) => () => this.setState({ hoveredNode: name });
  unhoverNode = () => this.setState({ hoveredNode: null });
  hoverEdge = (key) => () => this.setState({ hoveredEdge: key });
  unhoverEdge = () => this.setState({ hoveredEdge: null });
  goToIndex = (i) => () => this.setState({ index: i });

  items = [
    { title: 'MsPacman', subtitle: 'Make any image an svg file.' },
    { title: 'Coming soon', subtitle: '' },
    { title: 'Coming soon', subtitle: '' },
  ];

  nextItem = () => this.setState((s) => ({ index: (s.index + 1) % this.items.length }));
  prevItem = () => this.setState((s) => ({ index: (s.index + this.items.length - 1) % this.items.length }));

  renderVals() {
    const accentColor = this.props.accentColor ?? '#D96614';
    const mutedTextColor = this.props.mutedTextColor ?? '#B4B4B4';
    const edges = {
      brainWips: ['brain', 'wips'], brainWorld: ['brain', 'world'], brainDump: ['brain', 'dump'],
      wipsWorld: ['wips', 'world'], worldDump: ['world', 'dump'], wipsDump: ['wips', 'dump'],
    };
    const edgeColor = {};
    for (const key in edges) {
      edgeColor[key] = edges[key].includes(this.state.hoveredNode) ? accentColor : '#000000';
    }
    const edgeGlow = {};
    const edgeWidth = {};
    for (const key in edges) {
      const active = edges[key].includes(this.state.hoveredNode) || this.state.hoveredEdge === key;
      edgeGlow[key] = 'none';
      edgeWidth[key] = active ? 2 : 1;
    }
    const navHover = { brain: this.hoverNode('brain'), dump: this.hoverNode('dump'), wips: this.hoverNode('wips'), world: this.hoverNode('world') };
    const edgeHover = {};
    for (const key in edges) { edgeHover[key] = this.hoverEdge(key); }
    const navColor = { brain: '#000000', dump: '#000000', wips: accentColor, world: '#000000' };
    if (this.state.hoveredNode) navColor[this.state.hoveredNode] = accentColor;

    const dots = this.items.map((_, i) => ({ color: i === this.state.index ? accentColor : '#BFBFBF' }));

    return {
      accentColor, mutedTextColor,
      edgeGlow, edgeWidth, edgeColor, navColor, navHover, edgeHover, dots,
      currentItem: this.items[this.state.index],
      hoverNode: this.hoverNode, unhoverNode: this.unhoverNode,
      goToIndex: this.goToIndex, nextItem: this.nextItem, prevItem: this.prevItem,
    };
  }
}

</script>
</body>
</html>
