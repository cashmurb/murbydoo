<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

  a { color: #D96614; }
  a:hover { color: #D96614; opacity: 0.8; }
</style>
<script>
function __scaleFit(){var s=Math.min(window.innerWidth/1440,window.innerHeight/1024);document.documentElement.style.setProperty('--s',s);}
window.addEventListener('resize',__scaleFit);window.addEventListener('DOMContentLoaded',__scaleFit);__scaleFit();
</script>
</helmet>
<div style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FFFFFF;">
<div style="width:1440px;height:1024px;background:#FFFFFF;position:relative;overflow:hidden;font-family:'Kode Mono',monospace;color:#000000;flex-shrink:0;transform:scale(var(--s,1));animation:fadeInPage .5s ease both;">

  <a href="home.html" style="position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:15px;color:#000000;text-decoration:none;z-index:10;">Cashmere Blanche Alin</a>

  <div style="position:absolute;left:1085px;top:43px;width:267px;height:64px;z-index:10;">
    <svg width="267" height="64" viewBox="0 0 267 64" style="position:absolute;top:0;left:0;">
      <line x1="45" y1="45.56" x2="98" y2="20" stroke="{{ edgeColor.brainWips }}" stroke-width="{{ edgeWidth.brainWips }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainWips }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="118" y1="20" x2="181" y2="46" stroke="{{ edgeColor.brainWorld }}" stroke-width="{{ edgeWidth.brainWorld }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainWorld }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="142" y1="12" x2="227" y2="12" stroke="{{ edgeColor.brainDump }}" stroke-width="{{ edgeWidth.brainDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.brainDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="45" y1="59" x2="142" y2="59" stroke="{{ edgeColor.wipsWorld }}" stroke-width="{{ edgeWidth.wipsWorld }}" stroke-linecap="round" onmouseenter="{{ edgeHover.wipsWorld }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="216" y1="54" x2="252" y2="20" stroke="{{ edgeColor.worldDump }}" stroke-width="{{ edgeWidth.worldDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.worldDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
      <line x1="58" y1="49" x2="234" y2="20" stroke="{{ edgeColor.wipsDump }}" stroke-width="{{ edgeWidth.wipsDump }}" stroke-linecap="round" onmouseenter="{{ edgeHover.wipsDump }}" onmouseleave="{{ unhoverEdge }}" style="transition:stroke .3s cubic-bezier(0.4,0,0.2,1), stroke-width .3s cubic-bezier(0.4,0,0.2,1);pointer-events:stroke;cursor:pointer;"></line>
    </svg>
    <a href="brain.html" onmouseenter="{{ navHover.brain }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:88px;top:1px;font-size:15px;text-decoration:none;color:{{ navColor.brain }};transition:color .2s;">Brain</a>
    <a href="dump.html" onmouseenter="{{ navHover.dump }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:235px;top:1px;font-size:15px;text-decoration:none;color:{{ navColor.dump }};transition:color .2s;">Dump</a>
    <a href="wips.html" onmouseenter="{{ navHover.wips }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:0px;top:53px;font-size:15px;text-decoration:none;color:{{ navColor.wips }};transition:color .2s;">WIPs</a>
    <a href="world.html" onmouseenter="{{ navHover.world }}" onmouseleave="{{ unhoverNode }}" style="position:absolute;left:158px;top:52px;font-size:15px;text-decoration:none;color:{{ navColor.world }};transition:color .2s;">World</a>
  </div>

  <div style="position:absolute;left:475px;top:211px;font-size:48px;font-weight:400;white-space:nowrap;">where to find me?</div>

  <div style="position:absolute;left:112px;top:450px;width:1216px;display:flex;justify-content:space-between;">
    <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
      <div style="width:190px;display:flex;flex-direction:column;align-items:center;">
        <div onclick="{{ s.onClick }}" onmouseenter="{{ s.onHover }}" onmouseleave="{{ s.onUnhover }}" style="position:relative;width:190px;height:188px;perspective:600px;cursor:pointer;">
          <div style="position:absolute;inset:0;border:1px solid #000000;border-radius:2px;box-shadow:{{ s.glow }};transition:box-shadow .3s ease;overflow:hidden;">
            <svg width="190" height="188" viewBox="0 0 191 188" style="position:absolute;top:0;left:0;">
              <path d="M95.5534 97.2421L189.678 0.720322L190.036 1.06943L95.9114 97.5912L95.5534 97.2421ZM0.501638 1.61016L95.5534 97.2421L95.1988 97.5945L0.147031 1.96262L0.501638 1.61016Z" fill="black" style="opacity:{{ s.flapClosedOpacity }};transition:opacity .4s ease;"></path>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:{{ s.contentOpacity }};transition:opacity .35s ease .1s;">
              <a href="{{ s.url }}" target="_blank" rel="noopener" onclick="{{ s.stop }}" style="font-size:15px;color:#000000;text-decoration:none;text-align:center;padding:0 12px;">{{ s.username }}</a>
            </div>
          </div>
          <div style="position:absolute;top:0;left:0;width:190px;height:97px;transform-origin:top center;transform:{{ s.flapTransform }};transition:transform .5s cubic-bezier(0.6,0.05,0.2,1);">
            <svg width="190" height="97" viewBox="0 0 191 98" style="position:absolute;top:0;left:0;">
              <path d="M0.5 0.5H190.5V0.5L95.5 97.5L0.5 0.5Z" fill="#FFFFFF" stroke="black"></path>
            </svg>
          </div>
        </div>
        <div style="margin-top:24px;font-size:15px;">{{ s.name }}</div>
      </div>
    </sc-for>
  </div>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hoveredNode: null, open: {}, hoveredEnvelope: null };
  hoverEnvelope = (id) => () => this.setState({ hoveredEnvelope: id });
  unhoverEnvelope = () => this.setState({ hoveredEnvelope: null });

  hoverNode = (name) => () => this.setState({ hoveredNode: name });
  unhoverNode = () => this.setState({ hoveredNode: null });
  hoverEdge = (key) => () => this.setState({ hoveredEdge: key });
  unhoverEdge = () => this.setState({ hoveredEdge: null });
  toggle = (id) => () => this.setState((s) => ({ open: { ...s.open, [id]: !s.open[id] } }));
  stopClick = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };

  data = [
    { id: 'github', name: 'GitHub', username: '@cashmurb', url: 'https://github.com/cashmurb' },
    { id: 'linkedin', name: 'LinkedIn', username: 'Cashmere Blanche Alin', url: 'https://www.linkedin.com/in/myrrhcash/' },
    { id: 'substack', name: 'Substack', username: '@casmurb', url: 'https://casmurb.substack.com/' },
    { id: 'instagram', name: 'Instagram', username: '@shewhofilms_', url: 'https://www.instagram.com/shewhofilms_/' },
  ];

  componentDidMount() {
    import('./content/socials-data.js').then((m) => { this.data = m.data; this.forceUpdate(); }).catch(() => {});
  }

  renderVals() {
    const accentColor = '#D96614';
    const edges = {
      brainWips: ['brain', 'wips'], brainWorld: ['brain', 'world'], brainDump: ['brain', 'dump'],
      wipsWorld: ['wips', 'world'], worldDump: ['world', 'dump'], wipsDump: ['wips', 'dump'],
    };
    const edgeColor = {};
    for (const key in edges) {
      edgeColor[key] = edges[key].includes(this.state.hoveredNode) ? accentColor : '#000000';
    }
    const edgeGlow = {};
    const edgeWidth = {};
    for (const key in edges) {
      const active = edges[key].includes(this.state.hoveredNode) || this.state.hoveredEdge === key;
      edgeGlow[key] = 'none';
      edgeWidth[key] = active ? 2 : 1;
    }
    const navHover = { brain: this.hoverNode('brain'), dump: this.hoverNode('dump'), wips: this.hoverNode('wips'), world: this.hoverNode('world') };
    const edgeHover = {};
    for (const key in edges) { edgeHover[key] = this.hoverEdge(key); }
    const navColor = { brain: '#000000', dump: '#000000', wips: '#000000', world: '#000000' };
    if (this.state.hoveredNode) navColor[this.state.hoveredNode] = accentColor;

    const socials = this.data.map((s) => {
      const isOpen = !!this.state.open[s.id];
      return {
        ...s,
        onClick: this.toggle(s.id),
        stop: this.stopClick,
        flapTransform: isOpen ? 'rotateX(180deg)' : 'rotateX(0deg)',
        flapClosedOpacity: isOpen ? 0 : 1,
        contentOpacity: isOpen ? 1 : 0,
        glow: (this.state.hoveredEnvelope === s.id || isOpen) ? `0 0 22px ${accentColor}99` : 'none',
        onHover: this.hoverEnvelope(s.id),
        onUnhover: this.unhoverEnvelope,
      };
    });

    return { edgeGlow, edgeWidth, edgeColor, navColor, hoverNode: this.hoverNode, unhoverNode: this.unhoverNode, socials };
  }
}

</script>
</body>
</html>
