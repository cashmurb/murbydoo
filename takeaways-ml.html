<dc-import name="BrainTopic" title="Machine Learning Fundamentals" sections="{{ sections }}" hint-size="1440px,1024px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    import('./content/topics/ml.js').then((m) => { this.sections = m.sections; this.forceUpdate(); }).catch(() => {});
  }
  sections = [
      { heading: "Bias–variance tradeoff", body: 'Coming soon.' },
      { heading: "Gradient descent", body: 'Coming soon.' },
      { heading: "Regularization techniques", body: 'Coming soon.' },
      { heading: "Model evaluation & metrics", body: 'Coming soon.' }
  ];
  renderVals() {
    return { sections: this.sections };
  }
}
</script>
